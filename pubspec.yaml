name: snapiq
description: "SnapIQ - Bilişsel refleks ve dikkat testi oyunu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  provider: ^6.0.0
  google_mobile_ads: ^6.0.0
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/cin_frames/
    - assets/arcade_icons/
    - assets/iq_avatars/
